name: Update contribution heatmap

on:
  push:
    paths:
      - "scripts/update_heatmap.py"
      - ".github/workflows/update-heatmap.yml"
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate exact GitHub contribution calendar
        run: python3 scripts/update_heatmap.py "${{ github.repository_owner }}" assets/heatmap.svg

      - name: Commit changed heatmap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/heatmap.svg
          if git diff --cached --quiet; then
            echo "Heatmap is already up to date."
          else
            git commit -m "chore: sync GitHub contribution heatmap"
            git push
          fi
